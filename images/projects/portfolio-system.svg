<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#09090c; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18181f"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="accent-lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4ff00"/>
      <stop offset="100%" stop-color="#a8db00"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer App Window Frame -->
  <rect x="25" y="25" width="1150" height="625" rx="14" fill="#0f0f14" stroke="#26262e" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Window Header / Title Bar -->
  <path d="M 25 39 Q 25 25 39 25 L 1161 25 Q 1175 25 1175 39 L 1175 68 L 25 68 Z" fill="#16161d"/>
  <circle cx="52" cy="46" r="6" fill="#ef4444"/>
  <circle cx="72" cy="46" r="6" fill="#eab308"/>
  <circle cx="92" cy="46" r="6" fill="#22c55e"/>
  
  
  <text x="130" y="51" fill="#888" font-size="13" font-family="monospace">https://sayyad-yameen.dev • Personal Portfolio Website</text>
  
  <!-- Mini Website Mockup inside browser window -->
  <!-- Mini Navbar -->
  <g transform="translate(60, 90)">
    <rect width="1080" height="50" rx="6" fill="#050505" stroke="#222"/>
    <text x="25" y="31" fill="#fff" font-size="17" font-weight="bold">SAYYAD <tspan fill="#d4ff00">YAMEEN</tspan></text>
    <text x="650" y="31" fill="#aaa" font-size="13">Home   About   Education   Skills   Projects   Contact</text>
    <rect x="965" y="10" width="95" height="30" rx="5" fill="#d4ff00"/>
    <text x="988" y="30" fill="#000" font-size="12" font-weight="bold">Let's Talk</text>
  </g>
  
  <!-- Mini Hero Section -->
  <g transform="translate(60, 160)">
    <rect width="1080" height="450" rx="10" fill="#08080a" stroke="#222"/>
    <circle cx="540" cy="200" r="180" fill="#d4ff00" opacity="0.05" filter="url(#shadow)"/>
    
    <rect x="420" y="40" width="240" height="28" rx="14" fill="#151515" stroke="#444"/>
    <text x="540" y="58" fill="#d4ff00" font-size="11" font-weight="bold" text-anchor="middle">⚡ ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE</text>
    
    <text x="540" y="130" fill="#ffffff" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="2">SAYYAD <tspan fill="#d4ff00">YAMEEN</tspan></text>
    <text x="540" y="170" fill="#dddddd" font-size="20" text-anchor="middle">AI &amp; ML Developer | Data Science Student | Python Developer</text>
    <text x="540" y="215" fill="#888888" font-size="14" text-anchor="middle">Passionate about building intelligent solutions, predictive models, and modern digital experiences.</text>
    
    <!-- CTA Buttons -->
    <rect x="420" y="250" width="115" height="40" rx="6" fill="#d4ff00"/>
    <text x="477" y="275" fill="#000" font-size="13" font-weight="bold" text-anchor="middle">View Work</text>
    <rect x="550" y="250" width="115" height="40" rx="6" fill="transparent" stroke="#555"/>
    <text x="607" y="275" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Contact Me</text>
    
    <!-- Mini Stats Strip -->
    <g transform="translate(140, 340)">
      <rect width="800" height="70" rx="8" fill="#111" stroke="#222"/>
      <text x="100" y="36" fill="#d4ff00" font-size="20" font-weight="bold" text-anchor="middle">10+</text>
      <text x="100" y="54" fill="#888" font-size="11" text-anchor="middle">Projects Completed</text>
      <text x="300" y="36" fill="#d4ff00" font-size="20" font-weight="bold" text-anchor="middle">8+</text>
      <text x="300" y="54" fill="#888" font-size="11" text-anchor="middle">Technologies</text>
      <text x="500" y="36" fill="#d4ff00" font-size="18" font-weight="bold" text-anchor="middle">Certified</text>
      <text x="500" y="54" fill="#888" font-size="11" text-anchor="middle">Python &amp; AI/ML</text>
      <text x="700" y="36" fill="#d4ff00" font-size="20" font-weight="bold" text-anchor="middle">B.Tech</text>
      <text x="700" y="54" fill="#888" font-size="11" text-anchor="middle">Data Science (Current)</text>
