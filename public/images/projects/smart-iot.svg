<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#09090c; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18181f"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="accent-lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4ff00"/>
      <stop offset="100%" stop-color="#a8db00"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer App Window Frame -->
  <rect x="25" y="25" width="1150" height="625" rx="14" fill="#0f0f14" stroke="#26262e" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Window Header / Title Bar -->
  <path d="M 25 39 Q 25 25 39 25 L 1161 25 Q 1175 25 1175 39 L 1175 68 L 25 68 Z" fill="#16161d"/>
  <circle cx="52" cy="46" r="6" fill="#ef4444"/>
  <circle cx="72" cy="46" r="6" fill="#eab308"/>
  <circle cx="92" cy="46" r="6" fill="#22c55e"/>
  
  
  <text x="130" y="51" fill="#888" font-size="13" font-family="monospace">SmartIoT Cloud Monitor • ESP32 &amp; Arduino Real-Time Telemetry Dashboard</text>
  <rect x="990" y="36" width="160" height="22" rx="4" fill="#222" stroke="#333"/>
  <text x="1000" y="51" fill="#22c55e" font-size="11" font-weight="bold">● Device: Online (MQTT)</text>
  
  <!-- 4 Telemetry Gauges -->
  <g transform="translate(60, 95)">
    <!-- Sensor 1: Temperature -->
    <rect x="0" y="0" width="250" height="150" rx="8" fill="#13131c" stroke="#292938"/>
    <text x="20" y="30" fill="#888" font-size="12">🌡️ AMBIENT TEMPERATURE</text>
    <text x="20" y="75" fill="#fff" font-size="36" font-weight="bold">24.6 <tspan font-size="20" fill="#d4ff00">°C</tspan></text>
    <text x="20" y="115" fill="#22c55e" font-size="12">● Status: Optimal Range (20-26°C)</text>
    <rect x="20" y="130" width="210" height="6" rx="3" fill="#222"/>
    <rect x="20" y="130" width="120" height="6" rx="3" fill="#d4ff00"/>
    
    <!-- Sensor 2: Humidity -->
    <rect x="275" y="0" width="250" height="150" rx="8" fill="#13131c" stroke="#292938"/>
    <text x="295" y="30" fill="#888" font-size="12">💧 RELATIVE HUMIDITY</text>
    <text x="295" y="75" fill="#fff" font-size="36" font-weight="bold">58.4 <tspan font-size="20" fill="#38bdf8">%</tspan></text>
    <text x="295" y="115" fill="#38bdf8" font-size="12">● Sensor: DHT22 Digital Sensor</text>
    <rect x="295" y="130" width="210" height="6" rx="3" fill="#222"/>
    <rect x="295" y="130" width="145" height="6" rx="3" fill="#38bdf8"/>
    
    <!-- Sensor 3: Ultrasonic Proximity -->
    <rect x="550" y="0" width="250" height="150" rx="8" fill="#13131c" stroke="#292938"/>
    <text x="570" y="30" fill="#888" font-size="12">📡 OBSTACLE DISTANCE</text>
    <text x="570" y="75" fill="#fff" font-size="36" font-weight="bold">42.8 <tspan font-size="20" fill="#a855f7">cm</tspan></text>
    <text x="570" y="115" fill="#22c55e" font-size="12">● Safe Clearance (&gt; 20 cm)</text>
    <rect x="570" y="130" width="210" height="6" rx="3" fill="#222"/>
    <rect x="570" y="130" width="160" height="6" rx="3" fill="#a855f7"/>
    
    <!-- Actuator: Relay 1 / Automation -->
    <rect x="825" y="0" width="255" height="150" rx="8" fill="#13131c" stroke="#292938"/>
    <text x="845" y="30" fill="#888" font-size="12">⚡ AUTOMATION RELAYS</text>
    <text x="845" y="75" fill="#d4ff00" font-size="32" font-weight="bold">ACTIVE</text>
    <text x="845" y="115" fill="#aaa" font-size="12">Fan: ON  |  Lamp: AUTO (PIR)</text>
    <rect x="845" y="130" width="215" height="6" rx="3" fill="#222"/>
    <rect x="845" y="130" width="215" height="6" rx="3" fill="#22c55e"/>
  </g>
  
  <!-- Graph & MQTT Feed -->
  <g transform="translate(60, 265)">
    <rect width="730" height="345" rx="10" fill="#13131c" stroke="#292938"/>
    <text x="25" y="32" fill="#fff" font-size="15" font-weight="bold">Real-Time Sensor Telemetry Stream (Last 60 Minutes)</text>
    
    <!-- Chart Background Grid -->
    <g transform="translate(45, 60)" stroke="#222" stroke-width="1">
      <line x1="0" y1="0" x2="640" y2="0"/>
      <line x1="0" y1="50" x2="640" y2="50"/>
      <line x1="0" y1="100" x2="640" y2="100"/>
      <line x1="0" y1="150" x2="640" y2="150"/>
      <line x1="0" y1="200" x2="640" y2="200"/>
      
      <!-- Temperature Wave (Lime) -->
      <path d="M 0 110 Q 80 80, 160 120 T 320 90 T 480 130 T 640 100" fill="none" stroke="#d4ff00" stroke-width="3"/>
      <!-- Humidity Wave (Blue) -->
      <path d="M 0 60 Q 80 90, 160 50 T 320 80 T 480 40 T 640 70" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4"/>
      
      <circle cx="640" cy="100" r="5" fill="#d4ff00"/>
      <circle cx="640" cy="70" r="5" fill="#38bdf8"/>
    </g>
    <text x="45" y="295" fill="#d4ff00" font-size="12">― Temperature (°C)</text>
    <text x="210" y="295" fill="#38bdf8" font-size="12">-- Humidity (%)</text>
    <text x="45" y="325" fill="#888" font-size="11">Data Polling Rate: 1,000 ms via ESP32 Wi-Fi Microcontroller</text>
  </g>
  
  <!-- Right: MQTT Log Feed -->
  <g transform="translate(810, 265)">
    <rect width="330" height="345" rx="10" fill="#13131c" stroke="#292938"/>
    <text x="20" y="32" fill="#fff" font-size="15" font-weight="bold">MQTT Serial Telemetry</text>
    
    <g transform="translate(20, 55)" font-family="monospace" font-size="11">
      <text y="15" fill="#666">[16:42:01] <tspan fill="#38bdf8">home/sensors/dht</tspan></text>
      <text y="30" fill="#aaa">{"temp":24.6,"hum":58.4}</text>
      
      <text y="60" fill="#666">[16:42:02] <tspan fill="#a855f7">home/sensors/dist</tspan></text>
      <text y="75" fill="#aaa">{"dist_cm":42.8,"state":1}</text>
      
      <text y="105" fill="#666">[16:42:03] <tspan fill="#22c55e">home/relay/state</tspan></text>
      <text y="120" fill="#aaa">{"relay1":1,"relay2":"AUTO"}</text>
      
      <text y="150" fill="#666">[16:42:04] <tspan fill="#38bdf8">home/sensors/dht</tspan></text>
      <text y="165" fill="#aaa">{"temp":24.7,"hum":58.3}</text>
      
      <text y="195" fill="#666">[16:42:05] <tspan fill="#d4ff00">sys/health/ping</tspan></text>
      <text y="210" fill="#d4ff00">{"rssi":-52,"status":"OK"}</text>
    </g>
  </g>

</svg>