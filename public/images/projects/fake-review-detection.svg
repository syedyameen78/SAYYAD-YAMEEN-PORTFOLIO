<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#09090c; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18181f"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="accent-lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4ff00"/>
      <stop offset="100%" stop-color="#a8db00"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer App Window Frame -->
  <rect x="25" y="25" width="1150" height="625" rx="14" fill="#0f0f14" stroke="#26262e" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Window Header / Title Bar -->
  <path d="M 25 39 Q 25 25 39 25 L 1161 25 Q 1175 25 1175 39 L 1175 68 L 25 68 Z" fill="#16161d"/>
  <circle cx="52" cy="46" r="6" fill="#ef4444"/>
  <circle cx="72" cy="46" r="6" fill="#eab308"/>
  <circle cx="92" cy="46" r="6" fill="#22c55e"/>
  
  
  <text x="130" y="51" fill="#888" font-size="13" font-family="monospace">TruthGuard AI • Natural Language Processing &amp; Deception Detection Dashboard</text>
  <rect x="990" y="36" width="160" height="22" rx="4" fill="#222" stroke="#333"/>
  <text x="1000" y="51" fill="#22c55e" font-size="11" font-weight="bold">● Accuracy: 94.8%</text>
  
  <!-- Left Side: Review Input and Classification Result -->
  <g transform="translate(60, 95)">
    <rect width="650" height="515" rx="10" fill="#13131c" stroke="#292938"/>
    
    <text x="25" y="35" fill="#fff" font-size="16" font-weight="bold">Customer Review Under NLP Evaluation</text>
    <rect x="25" y="55" width="600" height="120" rx="8" fill="#1b1b26" stroke="#38384a"/>
    <text x="40" y="85" fill="#eee" font-size="13.5">"This phone battery lasts for 5 entire days and charges to 100% in 3 minutes!</text>
    <text x="40" y="110" fill="#eee" font-size="13.5">Best phone in history! Five stars, absolutely perfect, zero complaints!"</text>
    <text x="40" y="145" fill="#888" font-size="11">Source: E-Commerce Product Reviews Dataset  |  Length: 26 words  |  Token Count: 31</text>
    
    <!-- Classification Verdict Box -->
    <rect x="25" y="195" width="600" height="100" rx="8" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
    <text x="45" y="235" fill="#ef4444" font-size="22" font-weight="bold">⚠️ FAKE / DECEPTIVE REVIEW DETECTED</text>
    <text x="45" y="265" fill="#fca5a5" font-size="13">Classification Confidence: <tspan font-weight="bold">94.7%</tspan>  |  Algorithm: Multinomial Naive Bayes + Bi-gram TF-IDF</text>
    
    <!-- Linguistic Features Breakdown -->
    <text x="25" y="330" fill="#fff" font-size="14" font-weight="bold">Linguistic Deception Indicators</text>
    
    <text x="25" y="365" fill="#aaa" font-size="12">Superlative Word Frequency (Overly Positive):</text>
    <rect x="320" y="352" width="260" height="14" rx="7" fill="#222"/>
    <rect x="320" y="352" width="235" height="14" rx="7" fill="#ef4444"/>
    <text x="590" y="365" fill="#ef4444" font-size="11" font-weight="bold">90%</text>
    
    <text x="25" y="405" fill="#aaa" font-size="12">Subjectivity &amp; Exaggeration Score:</text>
    <rect x="320" y="392" width="260" height="14" rx="7" fill="#222"/>
    <rect x="320" y="392" width="220" height="14" rx="7" fill="#f59e0b"/>
    <text x="590" y="405" fill="#f59e0b" font-size="11" font-weight="bold">84%</text>
    
    <text x="25" y="445" fill="#aaa" font-size="12">Technical Detail &amp; Specificity:</text>
    <rect x="320" y="432" width="260" height="14" rx="7" fill="#222"/>
    <rect x="320" y="432" width="40" height="14" rx="7" fill="#3b82f6"/>
    <text x="590" y="445" fill="#3b82f6" font-size="11" font-weight="bold">15%</text>
    
    <text x="25" y="490" fill="#888" font-size="12">Status: Flagged for automated moderation removal</text>
  </g>
  
  <!-- Right Side: Model Metrics & Confusion Matrix -->
  <g transform="translate(735, 95)">
    <rect width="405" height="515" rx="10" fill="#13131c" stroke="#292938"/>
    
    <text x="25" y="35" fill="#fff" font-size="16" font-weight="bold">Model Performance Metrics</text>
    
    <!-- Mini KPI grid -->
    <rect x="25" y="55" width="165" height="70" rx="6" fill="#1b1b26" stroke="#333"/>
    <text x="40" y="80" fill="#888" font-size="11">PRECISION</text>
    <text x="40" y="108" fill="#d4ff00" font-size="22" font-weight="bold">95.2%</text>
    
    <rect x="210" y="55" width="165" height="70" rx="6" fill="#1b1b26" stroke="#333"/>
    <text x="225" y="80" fill="#888" font-size="11">RECALL</text>
    <text x="225" y="108" fill="#d4ff00" font-size="22" font-weight="bold">94.1%</text>
    
    <!-- Confusion Matrix -->
    <text x="25" y="165" fill="#fff" font-size="14" font-weight="bold">Confusion Matrix (Test Split: 2,000)</text>
    
    <g transform="translate(45, 190)">
      <!-- Row 1 -->
      <rect x="60" y="20" width="120" height="60" fill="#166534" stroke="#22c55e"/>
      <text x="120" y="52" fill="#fff" font-size="17" font-weight="bold" text-anchor="middle">TP: 942</text>
      <text x="120" y="68" fill="#86efac" font-size="10" text-anchor="middle">Real Review</text>
      
      <rect x="195" y="20" width="120" height="60" fill="#450a0a" stroke="#dc2626"/>
      <text x="255" y="52" fill="#fff" font-size="17" font-weight="bold" text-anchor="middle">FP: 48</text>
      <text x="255" y="68" fill="#fca5a5" font-size="10" text-anchor="middle">False Alarm</text>
      
      <!-- Row 2 -->
      <rect x="60" y="90" width="120" height="60" fill="#450a0a" stroke="#dc2626"/>
      <text x="120" y="122" fill="#fff" font-size="17" font-weight="bold" text-anchor="middle">FN: 56</text>
      <text x="120" y="138" fill="#fca5a5" font-size="10" text-anchor="middle">Missed Fake</text>
      
      <rect x="195" y="90" width="120" height="60" fill="#166534" stroke="#22c55e"/>
      <text x="255" y="122" fill="#fff" font-size="17" font-weight="bold" text-anchor="middle">TN: 954</text>
      <text x="255" y="138" fill="#86efac" font-size="10" text-anchor="middle">Fake Caught</text>
      
      <!-- Axis Labels -->
      <text x="120" y="10" fill="#888" font-size="11" text-anchor="middle">Actual Real</text>
      <text x="255" y="10" fill="#888" font-size="11" text-anchor="middle">Actual Fake</text>
    </g>
    
    <text x="25" y="420" fill="#aaa" font-size="12">Pipeline: Tokenize &gt; Lemmatize &gt; TF-IDF &gt; MNB</text>
    <text x="25" y="445" fill="#888" font-size="11">Dataset: Amazon &amp; Yelp Product Reviews Corpus</text>
    <text x="25" y="470" fill="#d4ff00" font-size="12" font-weight="bold">✓ Model Validated on Unseen Holdout Set</text>
  </g>

</svg>